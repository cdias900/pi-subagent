name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node floor comes from the real host SDK's engines requirement
          node-version: '22.19.0'
          cache: 'npm'

      # `npm ci` is not used here: the committed lockfile is generated on macOS,
      # and npm's strict lockfile check fails on Linux runners over nested
      # platform-specific optional dependencies (rolldown's wasm binding pulls a
      # different @emnapi/core version than the lock records). Regenerating the
      # lock resolves prerelease versions that break the build, so we install
      # without the strict lockfile equality check.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Child prompt contract on the installed SDK
        env:
          PI_SUBAGENT_HOST_ROOT: ${{ github.workspace }}/node_modules/@earendil-works/pi-coding-agent
        run: npm test -- child-system-prompt.host.test.ts

      # The host-SDK contract test is deliberately NOT part of the default
      # `npm test` suite: it is excluded in vitest.config.ts and runs under
      # vitest.host.config.ts, which aliases `@mariozechner/pi-ai` to the
      # real host package `@earendil-works/pi-ai` (its `compat` entry). It is
      # the only check that catches a symbol being removed from the real host
      # SDK — the exact class of bug that broke this PR.
      - name: Host SDK contract test
        run: npm run test:host
